name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests inject their own clock; this keeps the app importable and deterministic.
      SIH_CLOCK_MODE: fixed
      SIH_CLOCK_FIXED_AT: "2026-10-22T09:00:00+00:00"
      SIH_DATABASE_URL: sqlite:///./ci.db
      SIH_JWT_SECRET: ci-only-secret
      SIH_PASSWORD_HASH_ITERATIONS: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint Python syntax
        run: python -m compileall -q app tests migrations
      - name: Alembic migration matches models
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        run: pytest -q --cov=app --cov-report=term-missing
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/.coverage
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check and build
        run: npm run build
