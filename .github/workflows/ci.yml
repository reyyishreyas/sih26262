name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests inject their own clock; this keeps the app importable and deterministic.
      SIH_CLOCK_MODE: fixed
      SIH_CLOCK_FIXED_AT: "2026-10-22T09:00:00+00:00"
      SIH_DATABASE_URL: sqlite:///./ci.db
      SIH_JWT_SECRET: ci-only-secret
      SIH_PASSWORD_HASH_ITERATIONS: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint Python syntax
        run: python -m compileall -q app tests migrations
      - name: Alembic migration matches models
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        run: pytest -q --cov=app --cov-report=term-missing
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/.coverage
          if-no-files-found: ignore

  postgres-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sih26262
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sih26262"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: sih26262
      PGUSER: postgres
      PGPASSWORD: postgres_dev_only
      SIH_SIMULATION_SCHEMA: sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Bootstrap least-privilege roles
        run: psql -v ON_ERROR_STOP=1 -f backend/sql/bootstrap_roles.sql
      - name: Migrate as sih_migrator
        working-directory: backend
        env:
          SIH_DATABASE_URL: postgresql+psycopg://sih_migrator:sih_migrator_dev@localhost:5432/sih26262
        run: |
          alembic upgrade head
          alembic check
      - name: Apply grants as superuser
        run: psql -v ON_ERROR_STOP=1 -f backend/sql/roles.sql
      - name: Prove role isolation
        working-directory: backend
        run: python -m scripts.verify_isolation
      - name: Seed through the application role
        working-directory: backend
        env:
          SIH_DATABASE_URL: postgresql+psycopg://app_rw:app_rw_dev@localhost:5432/sih26262
          SIH_CLOCK_MODE: fixed
          SIH_CLOCK_FIXED_AT: "2026-10-22T09:00:00+00:00"
          SIH_JWT_SECRET: ci-only-secret
          SIH_PASSWORD_HASH_ITERATIONS: "1000"
        run: python -m app.services.seed

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check and build
        run: npm run build
